name: CI

# Verify runtime syntax/lint, the fork's regression tests, and its isolated
# browser harness without requiring a ComfyUI installation or GPU.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Byte-compile the backend
        run: python -m compileall -q tsab __init__.py
      - name: Backend customization regressions
        run: python -m unittest discover -s tests -p 'backend_*.py' -v
      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip
          # Pinned: an unpinned "latest" turns a new upstream rule into a
          # red build with no change of ours behind it.
          python -m pip install "ruff==0.15.12"
          python -m ruff check tsab __init__.py

  frontend:
    name: Frontend (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every frontend module
        run: |
          set -e
          for tsFile in js/*.js; do
            node --check "$tsFile"
          done
      - name: Frontend layout and state regressions
        run: npm test

  browser:
    name: Isolated browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
